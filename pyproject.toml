[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Vietnamese-Sentiment-Analysis"
version = "0.1.0"
description = "Vietnamese sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
torch = ["torch>=2.5"]
neural = [
    "torch>=2.5",
    "transformers>=4.40",
    "accelerate>=0.29",
]
embeddings = ["fasttext-wheel>=0.9.2"]
segment = ["underthesea>=6.8"]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentiment*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
